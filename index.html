<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sakshi ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #ffdde1;
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(238, 156, 167, 0.4);
            max-width: 380px;
            width: 100%;
            position: relative;
        }

        .gif-container img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        h1 {
            color: #d63384;
            font-size: 1.5rem;
            margin-bottom: 20px;
            min-height: 50px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
            position: relative;
            min-height: 60px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s ease, font-size 0.2s ease;
        }

        .btn-yes {
            background-color: #28a745;
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
            z-index: 2;
        }

        .btn-no {
            background-color: #dc3545;
            color: white;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
            position: absolute;
            transition: all 0.2s ease;
        }

        /* Spotify Player */
        .music-player {
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Cute Animated GIF -->
        <div class="gif-container">
            <img id="bear-gif" src="https://media.tenor.com/gU21P31A2GMAAAAi/bear-panda.gif" alt="Cute Bear">
        </div>

        <h1 id="question-text">Suno Sakshi... Please Maan Jao Na? 🥺</h1>

        <div class="btn-container" id="button-area">
            <button class="btn btn-yes" id="yesBtn" onclick="onYesClick()">Accha Thik Hai ❤️</button>
            <button class="btn btn-no" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">Nahi 😤</button>
        </div>

        <!-- Spotify player for Jo Tum Mere Ho -->
        <div class="music-player" id="spotify-player">
            <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/0eCajpR75pDW0r64U6hP2x?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </div>

    <script>
        const texts = [
            "Suno Sakshi... Please Maan Jao Na? 🥺",
            "I'm really really SORRY... 😿",
            "Soch lo achhe se... Ek baar aur! 💭",
            "Maan bhi jao kitna bhav khaogi? 🌸",
            "Ab toh Haan bol do Sakshi! ❤️"
        ];

        const gifs = [
            "https://media.tenor.com/gU21P31A2GMAAAAi/bear-panda.gif",
            "https://media.tenor.com/X_4m83j1bQ0AAAAi/mocha-bear-crying.gif",
            "https://media.tenor.com/J3-bS3T4K8kAAAAi/milk-and-mocha.gif",
            "https://media.tenor.com/Z4N80C--K54AAAAi/bear-hug.gif"
        ];

        let step = 0;
        let yesScale = 1;

        function moveNoButton() {
            step = (step + 1) % texts.length;
            
            // Update question & gif
            document.getElementById('question-text').innerText = texts[step];
            document.getElementById('bear-gif').src = gifs[step % gifs.length];

            // Make YES button bigger
            yesScale += 0.25;
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.style.transform = `scale(${yesScale})`;

            // Randomly move NO button around
            const noBtn = document.getElementById('noBtn');
            const x = Math.floor(Math.random() * 200) - 100;
            const y = Math.floor(Math.random() * 200) - 100;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        function onYesClick() {
            document.getElementById('question-text').innerText = "Hehehe, I knew it! I Love You Sakshi ❤️✨";
            document.getElementById('bear-gif').src = "https://media.tenor.com/85y9mYtFqX8AAAAi/milk-and-mocha-hug.gif";
            
            // Hide buttons and show Spotify track
            document.getElementById('button-area').style.display = 'none';
            document.getElementById('spotify-player').style.display = 'block';
        }

        // Set initial NO button position next to YES
        window.onload = function() {
            const noBtn = document.getElementById('noBtn');
            noBtn.style.right = '30px';
        };
    </script>

</body>
</html>
